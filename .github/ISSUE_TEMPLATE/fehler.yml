name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung. Bitte keine Zugangsdaten, Server-Adressen oder
        Kontonamen eintragen; dieses Issue ist öffentlich. Sicherheitslücken
        bitte über den Weg in SECURITY.md melden.
  - type: textarea
    id: beobachtung
    attributes:
      label: Beobachtung
      description: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: erwartung
    attributes:
      label: Erwartung
      description: Was hättest du stattdessen erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachvollziehen
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: weg
    attributes:
      label: Installationsweg
      options:
        - Wine (Homebrew)
        - Wineskin Winery
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS-Version und Prozessor
      placeholder: "z. B. macOS 14.5, Apple Silicon"
