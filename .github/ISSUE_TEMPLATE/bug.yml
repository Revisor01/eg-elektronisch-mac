name: Report a bug
description: Something does not work as expected.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include credentials, server
        addresses or account names; this issue is public. Report security
        issues as described in SECURITY.md.
  - type: textarea
    id: observation
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Installation method
      options:
        - Wine (Homebrew)
        - Wineskin Winery
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and processor
      placeholder: "e.g. macOS 14.5, Apple Silicon"
